<meta property="og:title" content="Love, Always — The wartime letters of Raymond Eugene Lankford" />
<meta property="og:description" content="Love letters from a sailor aboard the U.S.S. New Orleans to the girl back home in Stanford, Kentucky. 1940–1943." />
<meta property="og:url" content="https://blakewmorrisuk.github.io/love-always-gene/" />

<!-- Fonts are self-hosted (fonts.css + fonts/*.woff2) so the site loads
     from a single origin. Regenerate via the Google Fonts css2 endpoint if
     families ever change; keep unicode-range + font-display intact. -->
<link rel="stylesheet" href="fonts.css" />

<style>
:root {
  --paper:        #1A2532;
  --paper-deep:   #15202B;
  --card:         #212F3F;
  --card-deep:    #1B2837;
  --walnut:       #D9DFE7;
  --walnut-soft:  #B7C1CD;
  --walnut-mute:  #8C98A6;
  --brass:        #C9A85C;
  --brass-soft:   #E0C992;
  --brass-faint:  #EDDDB4;
  --ink:          #F1EEE4;
  --telegram:     #E8DDC4;
  --navy:         #8FAEC7;
  --navy-soft:    #A9C2D6;
  --navy-deep:    #6F91AB;
  --war-red:      #451A20;
  --war-red-deep: #2B0F14;

  /* Airmail reskin 2026-07-11: token NAMES kept for the hundreds of var()
     call sites, but the meanings drifted: walnut is now slate ink,
     brass is carmine, navy is airmail blue. --telegram stays warm on
     purpose (physical artifact prop, like the scans).
     The *-rgb twins feed rgba() tints so opacity variants track their
     base color; edit hex + twin together. */
  --paper-light: #243347;
  --brass-deep:  #B18E45;
  --ink-rgb: 241, 238, 228;
  --paper-rgb: 26, 37, 50;
  --shadow-rgb: 8, 12, 18;
  --walnut-rgb: 217, 223, 231;
  --walnut-soft-rgb: 183, 193, 205;
  --brass-rgb: 201, 168, 92;
  --brass-soft-rgb: 224, 201, 146;
  --brass-faint-rgb: 237, 221, 180;
  --navy-rgb: 143, 174, 199;
  --navy-soft-rgb: 169, 194, 214;
  --navy-deep-rgb: 111, 145, 171;
  --war-red-rgb: 69, 26, 32;
  --war-red-deep-rgb: 43, 15, 20;
  --signal-rgb: 194, 74, 74;
  --signal-deep-rgb: 168, 58, 58;
  /* midnight: the chapter-divider SKIN needs its own darks now that the
     navy tokens carry light foreground duty (drop caps, pins, rain). */
  --chapter-navy: #233246;
  --chapter-navy-deep: #1B2836;
  --chapter-navy-rgb: 35, 50, 70;

  --serif-display: "Cormorant Garamond", "EB Garamond", Garamond, serif;
  --serif-body:    "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --hand:          "Caveat", "Homemade Apple", cursive;
  --mono:          "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --measure: 36rem;
}

* { box-sizing: border-box; }

html, body {
  background: var(--paper);
  margin: 0;
  padding: 0;
  /* Lock the viewport so the book stage owns scroll */
  overflow: hidden;
  height: 100%;
  transition: background 0.6s cubic-bezier(0.65, 0, 0.35, 1);
}
body {
  font-family: var(--serif-body);
  color: var(--walnut);
  font-size: 18px;
  line-height: 1.72;
  font-feature-settings: "kern", "onum", "liga", "dlig", "ss01";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Navy body when on a chapter divider page (set by App via classList) */
body.body--navy,
body.body--navy html { background: var(--chapter-navy); }
body.body--navy .stage { background: var(--chapter-navy); }

/* War body — Chapter IV "At War" divider. Deep oxblood with a subtle
   inward vignette so it reads as a layered field, not a flat block.
   Brass-faint text and chrome stays legible against it. */
body.body--war,
body.body--war html { background: var(--war-red); }
body.body--war .stage {
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%, var(--war-red) 0%, var(--war-red-deep) 100%);
}
body.body--war .paper-grain { opacity: 0; }
body.body--war .nav-chrome {
  background: linear-gradient(to top, var(--war-red-deep) 35%, rgba(var(--war-red-deep-rgb), 0));
}
body.body--war .nav-btn { color: var(--brass-faint); }
body.body--war .nav-btn:hover, body.body--war .nav-btn:focus-visible { color: var(--ink); }
body.body--war .nav-btn::after { background: var(--brass-soft); }
body.body--war .nav-arrow { color: var(--brass-soft); }
body.body--war .nav-btn:hover .nav-arrow { color: var(--ink); }
body.body--war .toc-btn {
  color: var(--brass-faint);
  border-color: rgba(var(--brass-soft-rgb), 0.4);
}
body.body--war .toc-btn:hover {
  color: var(--ink);
  background: rgba(var(--war-red-rgb), 0.55);
  border-color: var(--brass-soft);
}
body.body--war .progress-track { background: rgba(var(--brass-soft-rgb), 0.18); }
body.body--war .progress-fill { background: var(--brass-soft); box-shadow: 0 0 6px rgba(var(--brass-soft-rgb), 0.5); }
body.body--war .folio { color: var(--brass-faint); }
body.body--war .folio::before, body.body--war .folio::after { background: var(--brass-soft); opacity: 0.45; }

/* paper grain — layered, with a faint vignette for depth */
.paper-grain {
  position: fixed; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(var(--brass-rgb), 0.07), transparent 55%),
    radial-gradient(ellipse at 90% 95%, rgba(var(--shadow-rgb), 0.07), transparent 50%),
    radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(var(--shadow-rgb), 0.08) 100%);
  z-index: 1;
  transition: opacity 1.2s ease;
}
body.body--navy .paper-grain { opacity: 0; }

::selection { background: rgba(var(--brass-rgb), 0.28); color: var(--ink); }

/* ---- atmospheric layer ------------------------------------------- */

.atmosphere {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.4s ease;
}
.atmosphere--on { opacity: 1; }

/* snow (great lakes) */
.snow-flake {
  position: absolute;
  top: -10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
  box-shadow: 0 0 4px rgba(255,255,255,0.4);
  animation-name: snow-fall;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  will-change: transform;
}
@keyframes snow-fall {
  0%   { transform: translate3d(0, -10vh, 0) translateX(0); opacity: 0; }
  10%  { opacity: var(--snow-op, 0.55); }
  90%  { opacity: var(--snow-op, 0.55); }
  100% { transform: translate3d(var(--snow-drift, 40px), 110vh, 0); opacity: 0; }
}

/* dust motes (san diego) */
.dust-mote {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255, 220, 150, 0.7), rgba(200,160,80,0.05) 70%);
  filter: blur(0.3px);
  animation-name: dust-drift;
  animation-iteration-count: infinite;
  animation-timing-function: ease-in-out;
  will-change: transform;
}
@keyframes dust-drift {
  0%   { transform: translate3d(0,0,0); opacity: 0; }
  20%  { opacity: var(--dust-op, 0.45); }
  80%  { opacity: var(--dust-op, 0.45); }
  100% { transform: translate3d(var(--dust-x, 80px), var(--dust-y, -120px), 0); opacity: 0; }
}

/* sea horizon (pearl harbor) — subtle horizontal drift */
.sea-layer {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 120% 40% at 50% 65%, rgba(var(--navy-rgb), 0.18), transparent 70%),
    radial-gradient(ellipse 100% 22% at 50% 70%, rgba(var(--brass-rgb), 0.10), transparent 75%);
}
.sea-shimmer {
  position: absolute;
  bottom: 28%;
  left: -10%;
  right: -10%;
  height: 1px;
  background: linear-gradient(to right,
    transparent,
    rgba(var(--brass-faint-rgb), 0.0) 20%,
    rgba(var(--brass-faint-rgb), 0.55) 50%,
    rgba(var(--brass-faint-rgb), 0.0) 80%,
    transparent);
  animation: sea-shimmer 9s ease-in-out infinite;
}
.sea-shimmer.s2 { bottom: 32%; animation-delay: 2.5s; animation-duration: 11s; opacity: 0.6; }
.sea-shimmer.s3 { bottom: 24%; animation-delay: 5s; animation-duration: 13s; opacity: 0.5; }
@keyframes sea-shimmer {
  0%, 100% { transform: translateX(-30px); opacity: 0; }
  50% { opacity: 0.7; }
  100% { transform: translateX(30px); opacity: 0; }
}

/* gentle palm-shadow sweep across the lower portion */
.sea-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(var(--navy-rgb), 0.18), transparent 70%);
  animation: sea-breathe 18s ease-in-out infinite;
}
@keyframes sea-breathe {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ---- weather: rain / drizzle ----------------------------------- */
.rain-streak {
  position: absolute;
  top: -10vh;
  width: 1.5px;
  background: linear-gradient(to bottom,
    transparent 0%,
    rgba(var(--navy-rgb), 0.0) 10%,
    rgba(var(--navy-rgb), 0.7) 60%,
    rgba(var(--navy-rgb), 0.0) 100%);
  animation-name: rain-fall;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  will-change: transform;
  transform: rotate(10deg);
  transform-origin: top;
  filter: blur(0.3px);
}
@keyframes rain-fall {
  0%   { transform: translate3d(0, -10vh, 0) rotate(10deg); opacity: 0; }
  10%  { opacity: var(--rain-op, 0.7); }
  90%  { opacity: var(--rain-op, 0.7); }
  100% { transform: translate3d(0, 120vh, 0) rotate(10deg); opacity: 0; }
}
/* atmospheric haze that accompanies rain so even-tempo letters feel wet */
.rain-mist {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 110% 70% at 50% -10%, rgba(var(--navy-rgb), 0.10), transparent 65%),
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(var(--navy-rgb), 0.06), transparent 60%);
  animation: rain-mist-pulse 14s ease-in-out infinite;
}
@keyframes rain-mist-pulse {
  0%, 100% { opacity: 0.8; }
  50%      { opacity: 1; }
}

/* ---- weather: fog / haze --------------------------------------- */
.fog-layer {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 90% 70% at 30% 50%, rgba(220,215,200,0.32), transparent 65%),
    radial-gradient(ellipse 80% 60% at 75% 60%, rgba(220,215,200,0.28), transparent 65%);
  animation: fog-drift 32s ease-in-out infinite;
}
.fog-layer.f2 { animation-duration: 48s; animation-direction: reverse; opacity: 0.7; }
@keyframes fog-drift {
  0%, 100% { transform: translate3d(-3%, 0, 0); opacity: 0.85; }
  50%      { transform: translate3d(3%, -1%, 0); opacity: 1; }
}

/* ---- weather: cloud shadows ------------------------------------ */
.cloud-shape {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.32), rgba(220,210,180,0.0) 70%);
  filter: blur(12px);
  animation-name: cloud-drift;
  animation-iteration-count: infinite;
  animation-timing-function: linear;
  will-change: transform;
}
@keyframes cloud-drift {
  0%   { transform: translate3d(-30vw, 0, 0); opacity: 0; }
  10%  { opacity: var(--cloud-op, 0.55); }
  90%  { opacity: var(--cloud-op, 0.55); }
  100% { transform: translate3d(130vw, 0, 0); opacity: 0; }
}

/* ---- weather: sun rays + warm light ---------------------------- */
.sun-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%, rgba(255,228,170,0.35), transparent 55%),
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,210,140,0.22), transparent 50%);
  animation: sun-pulse 12s ease-in-out infinite;
}
@keyframes sun-pulse {
  0%, 100% { opacity: 0.85; }
  50%      { opacity: 1; }
}
.sun-ray {
  position: absolute;
  top: 0;
  width: 1px;
  height: 60vh;
  background: linear-gradient(to bottom, rgba(255,228,170,0.4), transparent 70%);
  transform-origin: top center;
  animation: ray-shimmer 9s ease-in-out infinite;
}
@keyframes ray-shimmer {
  0%, 100% { opacity: 0.0; }
  50%      { opacity: 0.45; }
}

/* ---- weather: thunderstorm flash ------------------------------- */
.lightning-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 100% 40% at 50% 0%, rgba(255,255,235,0.65), transparent 55%);
  opacity: 0;
  animation: lightning 11s linear infinite;
  pointer-events: none;
}
@keyframes lightning {
  0%, 6%, 8%, 12%, 100% { opacity: 0; }
  6.5%  { opacity: 0.85; }
  7%    { opacity: 0.1; }
  7.5%  { opacity: 0.7; }
  8.5%  { opacity: 0; }
}

/* ---- weather: clear-night stars (rare for these dates) --------- */
.star-twinkle {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: rgba(var(--brass-faint-rgb), 0.85);
  box-shadow: 0 0 4px rgba(var(--brass-faint-rgb), 0.6);
  animation: twinkle 4s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; }
  50%      { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .snow-flake, .dust-mote, .sea-shimmer, .sea-vignette,
  .rain-streak, .fog-layer, .cloud-shape, .sun-glow, .sun-ray,
  .lightning-flash, .star-twinkle {
    animation: none !important;
  }
}

/* ---- weather glyph on letter card ------------------------------ */
.weather-glyph {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  opacity: 0.85;
  font-weight: 500;
  margin-top: -0.1rem;
}
.weather-glyph svg {
  width: 11px; height: 11px;
  flex-shrink: 0;
  fill: none;
  stroke: var(--walnut-mute);
  stroke-width: 1.3;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.85;
}
.weather-glyph .wg-temp { font-style: normal; color: var(--brass); font-weight: 600; letter-spacing: 0.06em; }

/* Pearl-Harbor countdown — quiet small-caps line that ties every letter
   to the date the reader knows is coming. Sits as one of the metadata
   details, not as a banner. Brass numerals + walnut-mute label so the
   number reads as the figure and 'days before Pearl Harbor' as the
   caption. */
.letter-countdown {
  font-family: var(--serif-body);
  font-size: 0.62rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
  opacity: 0.75;
  margin-top: -0.1rem;
  position: relative;
  padding-top: 0.4rem;
}
.letter-countdown::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 1px;
  background: var(--brass);
  opacity: 0.5;
}

/* ---- book stage --------------------------------------------------- */

.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  z-index: 3;
}

/* page surface — fills the viewport, scrolls internally.
   Transparent so the atmosphere layer (snow/rain/clouds/etc.) shows
   through; body bg supplies the page color. */
.page-surface {
  position: absolute;
  inset: 0;
  background: transparent;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
/* book-spine inset shadow lives on a separate fixed layer so it doesn't
   paint over the atmosphere */
.spine-shadow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  box-shadow: inset 18px 0 28px -18px rgba(var(--shadow-rgb), 0.18);
  transition: box-shadow 0.5s ease;
}
body.body--navy .spine-shadow { box-shadow: inset 18px 0 32px -18px rgba(0,0,0,0.5); }

/* ---- archive layout (inside each page surface) ------------------- */

.archive {
  position: relative;
  z-index: 1;
  max-width: 44rem;
  margin: 0 auto;
  padding: 3.2rem 1.5rem 6rem;
}
@media (min-width: 720px) {
  .archive { padding: 3.6rem 2.5rem 7rem; }
}

/* ---- folio (was "page-indicator") -------------------------------- */
/* Now lives INSIDE the scroll surface as a small folio mark up top.   */

.folio {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  width: 100%;
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.66rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  margin: 0 0 2rem;
  user-select: none;
  font-weight: 500;
}
.folio::before, .folio::after {
  content: "";
  display: inline-block;
  width: 24px;
  height: 1px;
  background: var(--brass);
  opacity: 0.4;
}
.folio .dot { color: var(--brass); margin: 0 0.55em; }
.folio-num { font-variant-numeric: tabular-nums; }
.is-navy .folio,
body.body--navy .folio { color: var(--brass-faint); }
body.body--navy .folio::before,
body.body--navy .folio::after { background: var(--brass-soft); opacity: 0.45; }

/* Running header for letter pages: chapter title flush left,
   Nº xxxii / cx flush right. No flanking dashes — the left/right
   anchors do the visual work themselves. */
.folio--running {
  justify-content: space-between;
  gap: 1.2rem;
  letter-spacing: 0.24em;
}
.folio--running::before, .folio--running::after { display: none; }
.folio-left, .folio-right {
  display: inline-flex;
  align-items: baseline;
  gap: 0.6em;
}
.folio-left { min-width: 0; }
.folio-chapter-title {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 0.92rem;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--walnut-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.folio-chapter-num {
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  color: var(--brass);
}
.folio-sep { color: var(--brass); opacity: 0.7; }
.folio-no {
  font-variant: small-caps;
  letter-spacing: 0.18em;
  color: var(--brass);
  font-weight: 600;
}
.folio-slash { color: var(--brass); opacity: 0.55; margin: 0 0.05em; }
.folio--running .folio-num {
  font-variant: small-caps;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  font-weight: 500;
}

/* ---- title page -------------------------------------------------- */

.title-page {
  text-align: center;
  padding: 0;
  min-height: calc(100vh - 6rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  isolation: isolate;
}
.title-page::before {
  content: "";
  position: absolute;
  inset: -3rem;
  z-index: -1;
  background:
    radial-gradient(ellipse 60% 60% at 50% 50%, rgba(var(--paper-rgb), 1) 0%, rgba(var(--paper-rgb), 0.0) 70%),
    radial-gradient(ellipse 100% 80% at 50% 50%, transparent 40%, rgba(var(--walnut-soft-rgb), 0.10) 100%);
  pointer-events: none;
}


.title-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.6rem;
}
.title-hero .ornament { margin-bottom: 0.4rem; width: min(20rem, 62vw); }

/* Locator below the names — Stanford / ✦ / U.S.S. New Orleans stacked
   on three centered rows so the place names are always axis-aligned,
   independent of viewport width. Reads like a chart label. */
.title-locator {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--serif-body);
  font-size: 0.7rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
  margin: 0.6rem 0 0;
  text-align: center;
}
.title-locator .locator-mark {
  font-family: var(--serif-display);
  font-size: 0.62rem;
  color: var(--brass);
  letter-spacing: 0;
  opacity: 0.75;
  line-height: 1;
}

/* Ship silhouette on the horizon — anchor at the bottom of the title
   centerpiece, just below the locator. The horizon line passes through
   the lower hull (waterline) and fades on both sides. Fades + rises
   in after the title text intro completes (~1.5s). */
.ship-horizon {
  position: relative;
  width: min(28rem, 72vw);
  margin: 2.4rem auto 0;
  opacity: 0;
  animation: ship-rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) 1.4s forwards;
}
.ship-horizon::before {
  content: "";
  position: absolute;
  left: -16%;
  right: -16%;
  bottom: 12%;
  height: 1px;
  background: linear-gradient(to right,
    transparent 0%,
    rgba(var(--brass-rgb), 0.0) 8%,
    rgba(var(--brass-rgb), 0.4) 30%,
    rgba(var(--brass-rgb), 0.4) 70%,
    rgba(var(--brass-rgb), 0.0) 92%,
    transparent 100%);
  pointer-events: none;
}
.ship-silhouette {
  width: 100%;
  height: auto;
  display: block;
  color: var(--walnut-soft);
  opacity: 0.78;
  position: relative;
}
@keyframes ship-rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .ship-horizon { animation: none; opacity: 1; transform: none; }
}

.title-eyebrow {
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.72rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--brass);
  margin-bottom: 2.6rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 1.1rem;
}
.title-eyebrow::before,
.title-eyebrow::after {
  content: "";
  display: inline-block;
  width: 32px; height: 1px;
  background: var(--brass);
  opacity: 0.6;
}

.title {
  font-family: var(--serif-display);
  font-weight: 500;
  font-size: clamp(3.6rem, 10vw, 6.6rem);
  line-height: 1;
  letter-spacing: -0.022em;
  color: var(--ink);
  margin: 0;
  font-style: italic;
  font-variation-settings: "opsz" 60;
}

.subtitle {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.05rem, 2.1vw, 1.2rem);
  line-height: 1.7;
  color: var(--walnut-soft);
  max-width: 32rem;
  margin: 0;
  letter-spacing: 0.04em;
}

.ornament {
  display: flex;
  align-items: center;
  gap: 1.4rem;
  width: min(22rem, 64vw);
  margin: 0 auto 2.6rem;
}
.ornament-rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--brass) 50%, transparent);
  opacity: 0.85;
}
.ornament-anchor { width: 56px; height: 56px; flex-shrink: 0; color: var(--brass); }

.frontispiece {
  font-family: var(--serif-body);
  font-style: italic;
  color: var(--walnut-mute);
  font-size: 0.98rem;
  line-height: 1.7;
  margin: 0 0 3.6rem;
  max-width: 26rem;
}

.title-count {
  font-family: var(--serif-display);
  font-style: italic;
  color: var(--walnut-mute);
  font-size: 0.98rem;
  line-height: 1.65;
  margin: 0;
  letter-spacing: 0.01em;
}

.title-prompt {
  margin-top: 3.2rem;
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.72rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--brass);
  display: inline-flex;
  align-items: center;
  gap: 0.7em;
  background: none;
  border: none;
  padding: 0.45rem 0;
  cursor: pointer;
  font-weight: 500;
  border-bottom: 1px solid transparent;
  transition: color 0.25s ease, border-color 0.25s ease, gap 0.25s ease;
}
.title-prompt::after {
  content: "→";
  font-family: var(--serif-display);
  font-size: 1.05rem;
  letter-spacing: 0;
  transition: transform 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  display: inline-block;
}
.title-prompt:hover, .title-prompt:focus-visible {
  color: var(--ink);
  border-bottom-color: var(--brass);
  outline: none;
  gap: 1em;
}
.title-prompt:hover::after,
.title-prompt:focus-visible::after { transform: translateX(4px); }

/* ---- chapter divider --------------------------------------------- */

.chapter-divider {
  text-align: center;
  padding: 2rem 0 4rem;
  min-height: calc(100vh - 8rem);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  position: relative;
  isolation: isolate;
}


/* huge translucent roman numeral — sits behind the title block.
   Pinned high so it doesn't bleed through the bridge prose lower on the
   spread; horizontally centered across the page. */
.chapter-watermark {
  position: absolute;
  top: clamp(2rem, 8vh, 6rem);
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: -1;
}
.chapter-watermark-text {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(11rem, 22vw, 18rem);
  line-height: 1;
  color: rgba(var(--brass-faint-rgb), 0.07);
  letter-spacing: -0.04em;
  user-select: none;
}

.chapter-numeral {
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.74rem;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--brass-soft);
  margin-bottom: 1.5rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
}
.chapter-numeral::before,
.chapter-numeral::after {
  content: "";
  display: inline-block;
  width: 28px; height: 1px;
  background: var(--brass-soft);
  opacity: 0.55;
}
.chapter-title {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(3rem, 7.4vw, 4.8rem);
  color: var(--ink);
  margin: 0 0 0.7rem;
  letter-spacing: -0.018em;
  line-height: 1.05;
  font-variation-settings: "opsz" 60;
}
.chapter-loc {
  font-family: var(--serif-display);
  font-size: 1.1rem;
  font-style: italic;
  color: var(--brass-faint);
  margin-bottom: 0.4rem;
}
.chapter-dates {
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.74rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--brass-soft);
}

.chapter-bridge {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 1.16rem;
  line-height: 1.7;
  color: var(--brass-faint);
  max-width: 32rem;
  margin: 0.6rem auto 1.4rem;
  text-align: justify;
  text-align-last: left;
  hyphens: auto;
  -webkit-hyphens: auto;
  padding: 0 1rem;
}

/* ---- route diagram ----------------------------------------------- */

.route-wrap {
  margin: 1.8rem auto 1rem;
  max-width: 38rem;
  width: 100%;
  padding: 0 1rem;
}
.route-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.route-line {
  stroke: var(--brass-soft);
  stroke-width: 1.2;
  stroke-dasharray: 1 7;
  opacity: 0.7;
  fill: none;
  stroke-linecap: round;
}
.route-pin-active {
  fill: var(--brass-soft);
  stroke: var(--brass-soft);
  stroke-width: 1;
}
.route-pin-active-halo {
  fill: none;
  stroke: var(--brass-soft);
  stroke-width: 1;
  opacity: 0.5;
  transform-origin: center;
  animation: route-pulse 3.4s ease-in-out infinite;
}
@keyframes route-pulse {
  0%, 100% { r: 11; opacity: 0.0; }
  50% { r: 16; opacity: 0.55; }
}
.route-pin-inactive {
  fill: var(--navy);
  stroke: var(--brass-soft);
  stroke-width: 1.2;
  opacity: 0.85;
}
.route-label {
  font-family: var(--serif-body);
  font-size: 13px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  fill: var(--brass-faint);
  font-weight: 500;
}
.route-label--active {
  fill: var(--ink);
  font-weight: 500;
}
.route-label-rule {
  stroke: var(--brass-soft);
  stroke-width: 1;
  opacity: 0.65;
}
.route-date {
  font-family: var(--serif-body);
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.04em;
  fill: var(--brass-soft);
}

@media (prefers-reduced-motion: reduce) {
  .route-pin-active-halo { animation: none !important; r: 11; opacity: 0.4; }
}

/* ---- journey map (frontispiece chart + per-letter waypoint) ------- */
/* Drawn on window.MAP_BASE (pre-projected Natural Earth coastlines) in
   the site's chart idiom: paper sea, walnut land, brass course line.
   Hollow pins + dashed legs mark censored positions reconstructed from
   the ship's record. */

.mc-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.mc-land {
  fill: rgba(var(--walnut-rgb), 0.14);
  stroke: var(--walnut-soft);
  stroke-width: 0.6;
  stroke-linejoin: round;
}
.mc-lake {
  fill: var(--paper);
  stroke: var(--walnut-soft);
  stroke-width: 0.4;
}
.mc-neatline {
  fill: none;
  stroke: var(--walnut-soft);
  stroke-width: 1;
  opacity: 0.45;
}
.mc-graticule line {
  stroke: var(--brass);
  stroke-width: 0.5;
  opacity: 0.13;
}
.mc-graticule .mc-grat-eq { opacity: 0.24; stroke-dasharray: 1 4; }
.mc-leg {
  fill: none;
  stroke: var(--brass);
  stroke-width: 1.6;
  stroke-linecap: round;
  opacity: 0.85;
}
.mc-leg--approx { stroke-dasharray: 4 5; opacity: 0.68; }
.mc-pin {
  fill: var(--navy);
  stroke: var(--brass-soft);
  stroke-width: 1.2;
}
.mc-pin--approx {
  fill: var(--paper);
  stroke: var(--brass);
  stroke-width: 1.4;
}
.mc-pin--active:not(.mc-pin--approx) { fill: var(--brass); stroke: var(--walnut-soft); }
.mc-pin--home {
  fill: var(--brass);
  stroke: var(--walnut-soft);
  stroke-width: 0.6;
}
.mc-pin-num {
  font-family: var(--mono);
  font-size: 8.5px;
  fill: var(--brass);
  font-weight: 500;
}
.mc-label {
  font-family: var(--serif-body);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  fill: var(--walnut-soft);
  font-weight: 500;
}
.mc-leader {
  stroke: var(--walnut-mute);
  stroke-width: 0.5;
  opacity: 0.6;
}
.mc-stop--link { cursor: pointer; }
.mc-stop--link:hover .mc-label,
.mc-stop--link:focus-visible .mc-label { fill: var(--brass); }
.mc-censored text {
  font-family: var(--hand);
  font-size: 17px;
  fill: rgb(var(--signal-rgb));
  opacity: 0.8;
}
.mc-censored .mc-censored-sub { font-size: 13px; opacity: 0.66; }
.mc-rose-ring { fill: none; stroke: var(--brass); stroke-width: 0.7; opacity: 0.35; }
.mc-rose-ring--inner { opacity: 0.18; stroke-width: 0.5; }
.mc-rose-line { stroke: var(--brass); stroke-width: 0.6; opacity: 0.3; }
.mc-rose-line--minor { opacity: 0.15; }
.mc-rose-north { fill: var(--brass); opacity: 0.55; }
.mc-rose-n {
  font-family: var(--serif-body);
  font-size: 9px;
  letter-spacing: 0.2em;
  fill: var(--brass);
  opacity: 0.6;
}

/* The Map page */
.journey-page { text-align: center; }
.journey-title {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(2.2rem, 5vw, 3rem);
  color: var(--ink);
  margin: 0;
  letter-spacing: -0.015em;
}
.journey-dates {
  font-family: var(--serif-body);
  font-size: 0.7rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
  margin-top: 0.8rem;
}
.journey-page .hairline-rule { margin: 1.4rem auto; }
.journey-chart { margin: 0 auto; }
.journey-legend {
  list-style: none;
  margin: 1.7rem auto 0;
  padding: 0;
  max-width: 36rem;
  text-align: left;
  display: grid;
  grid-template-columns: 1fr;
}
@media (min-width: 700px) {
  .journey-legend { grid-template-columns: 1fr 1fr; column-gap: 2.4rem; }
}
.journey-stop {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  width: 100%;
  min-height: 44px;
  padding: 0.3rem 0.5rem;
  background: none;
  border: none;
  border-bottom: 1px solid rgba(var(--brass-rgb), 0.18);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 0.25s ease;
}
.journey-stop:hover,
.journey-stop:focus-visible { background: rgba(var(--brass-rgb), 0.09); }
.journey-stop.is-focus { background: rgba(var(--brass-rgb), 0.13); }
.js-num {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--brass);
  min-width: 1.5em;
  text-align: right;
  flex-shrink: 0;
}
.js-meta { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.js-label {
  font-family: var(--serif-body);
  font-size: 0.86rem;
  color: var(--walnut);
  line-height: 1.3;
}
.js-dates {
  font-family: var(--serif-body);
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--walnut-mute);
}
/* Blake's note at the foot of the Map page: the censor explanation in
   quiet serif italic, the personal line and signoff in the hand. */
.journey-note-plain {
  font-family: var(--serif-body);
  font-style: italic;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--walnut-soft);
  opacity: 0.9;
  max-width: 30rem;
  margin: 2rem auto 0;
}
.journey-note {
  font-family: var(--hand);
  font-size: 1.18rem;
  line-height: 1.45;
  color: var(--walnut-soft);
  opacity: 0.85;
  max-width: 28rem;
  margin: 1.3rem auto 0;
}
.journey-signoff {
  font-family: var(--hand);
  font-size: 1.3rem;
  line-height: 1.35;
  color: var(--walnut-soft);
  opacity: 0.9;
  margin: 1.2rem auto 0;
}

/* The waypoint map under each letter */
.letter-waypoint {
  max-width: var(--measure);
  width: 100%;
  margin: 2.6rem auto 0;
}
.letter-waypoint-map {
  display: block;
  width: 100%;
  padding: 0;
  background: rgba(var(--brass-rgb), 0.045);
  border: 1px solid rgba(var(--brass-rgb), 0.28);
  border-radius: 2px;
  cursor: pointer;
  transition: border-color 0.3s ease, background 0.3s ease;
}
.letter-waypoint-map:hover,
.letter-waypoint-map:focus-visible {
  border-color: var(--brass);
  background: rgba(var(--brass-rgb), 0.08);
}
.letter-waypoint-caption {
  display: flex;
  justify-content: center;
  align-items: baseline;
  column-gap: 1.1em;
  row-gap: 0.2em;
  flex-wrap: wrap;
  margin-top: 0.55rem;
  font-family: var(--serif-body);
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
}
.letter-waypoint-caption .lw-place { color: var(--walnut-soft); }
.letter-waypoint-caption .lw-approx { color: rgb(var(--signal-rgb)); opacity: 0.85; }
.letter-waypoint-caption .lw-link { color: var(--brass); opacity: 0.9; }

.weather-glyph--approx { cursor: help; }

@media (max-width: 700px) {
  /* On a phone the chart keeps coastline, course, and pins; the numbered
     legend below carries the names and the tap targets. */
  .mc-label, .mc-pin-num, .mc-leader, .mc-rose, .mc-censored { display: none; }
}

/* ---- emphasis (scroll-triggered underline) ---------------------- */
/* Wraps a phrase that earns weight. A brass underline draws in once
   when the line scrolls into the viewport (IntersectionObserver flips
   .is-revealed). After that it stays underlined; subsequent scroll-bys
   do nothing — preserves the gesture. */
.emphasis {
  position: relative;
  display: inline;
  background-image: linear-gradient(var(--brass), var(--brass));
  background-repeat: no-repeat;
  background-position: 0 100%;
  background-size: 0% 1.5px;
  padding-bottom: 0.12em;
  transition: background-size 1.6s cubic-bezier(0.65, 0, 0.35, 1);
}
.emphasis.is-revealed {
  background-size: 100% 1.5px;
}
body.body--war .emphasis {
  background-image: linear-gradient(var(--brass-soft), var(--brass-soft));
}
@media (prefers-reduced-motion: reduce) {
  .emphasis {
    background-size: 100% 1.5px;
    transition: none;
  }
}

/* ---- letter card ------------------------------------------------- */

.letter-card {
  margin: 0 auto;
  max-width: var(--measure);
  padding: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.letter-head {
  text-align: center;
  margin-bottom: 2rem;
  width: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
}
/* Reserve horizontal margin on the centered text content so it never
   runs under the absolute-positioned postmark on the right. The empty
   space mirrors on the left to keep the date/stamp visually centered. */
.letter-head .letter-num,
.letter-head .letter-stamp,
.letter-head .weather-glyph {
  max-width: calc(100% - 11rem);
}
@media (max-width: 540px) {
  .letter-head .letter-num,
  .letter-head .letter-stamp,
  .letter-head .weather-glyph {
    max-width: calc(100% - 9rem);
  }
}
.letter-eyebrow {
  font-family: var(--serif-body);
  font-size: 0.66rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--navy);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 0.7em;
  opacity: 0.85;
}
.letter-eyebrow::before,
.letter-eyebrow::after {
  content: "";
  display: inline-block;
  width: 14px; height: 1px;
  background: var(--navy);
  opacity: 0.55;
}
.letter-num {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 1.32rem;
  color: var(--navy-deep);
  letter-spacing: 0.005em;
}
.letter-num .dot {
  color: var(--navy);
  margin: 0 0.4em;
  font-style: normal;
}
.letter-stamp {
  font-family: var(--serif-body);
  font-size: 0.66rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--navy);
  font-weight: 500;
  opacity: 0.7;
  max-width: 28rem;
  text-align: center;
  line-height: 1.5;
}

/* postmark — circular seal in the top-right of every letter header.
   Two-color ink: brass rings (warm, aged) + navy text (legible). Slight
   rotation for the hand-stamped feel. Mix-blend-mode multiply lets it
   read like ink on cream paper. */
.postmark {
  position: absolute;
  top: -0.3rem;
  right: 0;
  width: 76px;
  height: 76px;
  display: block;
  pointer-events: none;
  opacity: 0.85;
  transform: rotate(-5deg);
  mix-blend-mode: multiply;
}
.postmark .pm-ring-outer,
.postmark .pm-ring-mid,
.postmark .pm-ring-inner { fill: none; }
.postmark .pm-ring-outer { stroke: var(--brass); stroke-width: 1.6; opacity: 0.95; }
.postmark .pm-ring-mid   { stroke: var(--brass); stroke-width: 0.5; opacity: 0.6; stroke-dasharray: 0.6 1.4; }
.postmark .pm-ring-inner { stroke: var(--brass); stroke-width: 0.9; opacity: 0.85; }
.postmark .pm-cancel     { stroke: var(--brass); stroke-width: 1.6; opacity: 0.7; stroke-linecap: round; }
.postmark .pm-arc-text {
  fill: var(--navy);
  font-family: var(--serif-body);
  font-weight: 600;
  letter-spacing: 0.16em;
}
.postmark .pm-month {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 7.8px;
  fill: var(--navy);
  opacity: 0.85;
}
.postmark .pm-day {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 15px;
  fill: var(--navy);
}
@media (max-width: 540px) {
  .postmark { width: 62px; height: 62px; top: -0.1rem; }
}

.letter-body {
  background: var(--card);
  padding: 2.8rem clamp(1.6rem, 4vw, 3.1rem) 2.4rem;
  border-radius: 2px;
  position: relative;
  font-family: var(--serif-body);
  font-size: 1.02rem;
  line-height: 1.78;
  color: var(--walnut);
  text-align: justify;
  text-align-last: left;
  text-justify: inter-word;
  hyphens: auto;
  -webkit-hyphens: auto;
  -ms-hyphens: auto;
  hyphenate-limit-chars: 6 3 3;
  word-spacing: -0.01em;
  width: 100%;
  border: 1px solid rgba(var(--navy-rgb), 0.18);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 0 0 1px rgba(var(--brass-rgb), 0.08),
    0 14px 32px -14px rgba(var(--navy-rgb), 0.22),
    0 3px 8px rgba(var(--shadow-rgb), 0.07);
  background-image:
    radial-gradient(ellipse 80% 60% at 22% 14%, rgba(var(--navy-rgb), 0.04), transparent 70%),
    radial-gradient(ellipse 60% 50% at 82% 92%, rgba(var(--shadow-rgb), 0.05), transparent 70%);
}
/* binding rule on top — navy ink with brass glints */
.letter-body::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(var(--navy-rgb), 0.0) 6%,
      rgba(var(--navy-rgb), 0.55) 22%,
      rgba(var(--brass-rgb), 0.7) 50%,
      rgba(var(--navy-rgb), 0.55) 78%,
      rgba(var(--navy-rgb), 0.0) 94%,
      transparent 100%);
  pointer-events: none;
}
/* second hairline rule for depth */
.letter-body::after {
  content: "";
  position: absolute;
  top: 6px; left: 12%; right: 12%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--navy-rgb), 0.22) 50%, transparent);
  pointer-events: none;
}

.salutation {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 1.45rem;
  color: var(--navy-deep);
  margin-bottom: 1rem;
  letter-spacing: 0.005em;
  font-weight: 500;
}

.letter-body p {
  margin: 0 0 1.15rem;
}
.letter-body p:last-of-type { margin-bottom: 0; }

/* drop cap — fixed-slot span the first paragraph carves out, so the
   reserved width and baseline are identical regardless of which letter
   appears (an "I" no longer sits in a narrow gutter while a "T" hangs
   over the next line). The actual letter is a real <span>; CSS
   ::first-letter doesn't accept width/text-align reliably. */
.letter-body .has-dropcap { /* paragraph hook — nothing structural needed */ }
.letter-body .dropcap {
  float: left;
  display: inline-block;
  width: 0.92em;
  text-align: center;
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 3.7em;
  line-height: 0.86;
  color: var(--navy);
  margin: 0.05em 0.18em -0.02em 0;
  padding: 0;
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
}

.signature {
  font-family: var(--hand);
  font-size: 2.5rem;
  color: var(--navy-deep);
  margin: 1.8rem 0 0.5rem;
  line-height: 1;
  letter-spacing: 0.005em;
  position: relative;
  display: inline-block;
}
.signature::after {
  content: "";
  display: block;
  width: 86px;
  height: 8px;
  margin-top: 0.25rem;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 86 8'><path d='M 1 4 Q 14 1 30 4 T 58 4 T 85 4' fill='none' stroke='%238FAEC7' stroke-width='0.9' stroke-linecap='round' opacity='0.55'/></svg>");
  background-repeat: no-repeat;
  background-size: contain;
}
.signature--xmas { text-align: center; margin-top: 1.2rem; }
.signature--xmas::after { margin-left: auto; margin-right: auto; }

.postscript {
  font-size: 0.95rem;
  color: var(--walnut-soft);
  margin-top: 0.4rem;
  font-style: italic;
}

/* Small brass dingbat used as a section break — body→postscript,
   body→historical note. Centered SVG mark flanked by short hairlines
   that fade out at the ends. Vertical room is ~1.2× line-height. */
.fleuron {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.9em;
  margin: 1.5rem auto 1.2rem;
  max-width: 30rem;
  color: var(--brass);
  user-select: none;
  line-height: 1;
}
.fleuron::before, .fleuron::after {
  content: "";
  flex: 1;
  height: 1px;
  max-width: 4.5rem;
  background: linear-gradient(to right, transparent, var(--brass-faint));
  opacity: 0.7;
}
.fleuron::after {
  background: linear-gradient(to left, transparent, var(--brass-faint));
}
.fleuron-glyph {
  flex-shrink: 0;
  opacity: 0.85;
}
.ps-mark {
  font-style: normal;
  font-variant: small-caps;
  letter-spacing: 0.08em;
  color: var(--navy);
  margin-right: 0.4em;
  font-weight: 600;
}
.ps-mark::before {
  content: "·";
  color: var(--brass);
  margin-right: 0.4em;
}

.incomplete-marker {
  font-style: italic;
  color: var(--walnut-mute);
  text-align: center;
  margin: 1.5rem 0 0;
  font-size: 0.92rem;
  letter-spacing: 0.04em;
}

.uncertain {
  font-size: 0.62em;
  color: var(--walnut-mute);
  vertical-align: sub;
  margin: 0 0.05em;
  font-style: italic;
}

.letter-note {
  font-family: var(--serif-body);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--walnut-mute);
  text-align: justify;
  text-align-last: left;
  hyphens: auto;
  -webkit-hyphens: auto;
  margin: 1.4rem auto 0;
  max-width: 30rem;
  line-height: 1.65;
}
/* Consecutive notes are paragraphs of one block, not separate notes —
   tighten the top margin so they read together. */

/* ---- photo link -------------------------------------------------- */

/* ---- context chip (quiet fixed placard, bottom-left) ------------- */

/* A slim museum-placard drawer flush against the viewport's left edge,
   shown only on the title page, below every modal/lightbox. It is ONE
   fixed-size element that never changes size: a .context-drawer-body plus a
   narrow 28px .context-drawer-handle strip permanently attached along its
   right edge. The whole container slides as a single piece —
      hidden    (translateX -100%)              first visit, before reveal
      collapsed (translateX -100% + 28px)       only the handle peeks
      is-open   (translateX 0)                  body slid fully into view
   Because it is one constant-size object, collapse/expand is a single
   continuous glide, not two objects swapping. is-open wins over is-revealed
   (declared later, equal specificity). */
.context-drawer {
  position: fixed;
  left: 0;
  bottom: calc(2.4rem + env(safe-area-inset-bottom, 0px));
  z-index: 40;
  display: flex;
  align-items: stretch;
  background: var(--card-deep);
  border: 1px solid rgba(var(--brass-rgb), 0.32);
  border-left: none;
  border-radius: 0 3px 3px 0;
  box-shadow: 0 8px 24px rgba(var(--shadow-rgb), 0.4);
  transform: translateX(-100%);
  pointer-events: none;
  transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
}
.context-drawer.is-revealed {
  transform: translateX(calc(-100% + 28px));
}
.context-drawer.is-open {
  transform: translateX(0);
}
.context-drawer-body {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  max-width: 15rem;
  padding: 0.75rem 0.95rem 0.8rem 0.95rem;
  pointer-events: none;
}
.context-drawer.is-open .context-drawer-body {
  pointer-events: auto;
}
.context-drawer-eyebrow {
  font-family: var(--serif-body);
  font-size: 0.6rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
}
.context-drawer-links {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.context-drawer-link {
  font-family: var(--serif-body);
  font-size: 0.85rem;
  color: var(--walnut-soft);
  text-decoration: none;
  letter-spacing: 0.01em;
  border-bottom: 1px solid rgba(var(--brass-rgb), 0.22);
  padding-bottom: 1px;
  align-self: flex-start;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.context-drawer-link:hover, .context-drawer-link:focus-visible {
  color: var(--brass-soft);
  border-bottom-color: var(--brass);
  outline: none;
}
/* The handle: a narrow vertical strip on the drawer's right edge, full
   height, always the click target. When the drawer is tucked away it is the
   only part still on-screen. It shares the container's border/palette; only
   a hairline divider separates it from the body. */
.context-drawer-handle {
  flex: 0 0 28px;
  width: 28px;
  align-self: stretch;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
  background: none;
  border: none;
  border-left: 1px solid rgba(var(--brass-rgb), 0.2);
  color: var(--walnut-mute);
  cursor: pointer;
  pointer-events: none;
  transition: color 0.2s ease;
}
.context-drawer.is-revealed .context-drawer-handle {
  pointer-events: auto;
}
.context-drawer-handle:hover, .context-drawer-handle:focus-visible {
  color: var(--brass-soft);
  outline: none;
}
/* Chevron cross-fades between › (collapsed) and ‹ (open) — unobtrusive, so
   nothing snaps mid-glide. */
.context-drawer-chevron {
  position: relative;
  display: inline-flex;
  width: 1ch;
  height: 1.2em;
  align-items: center;
  justify-content: center;
  font-family: var(--serif-body);
  font-size: 1.2rem;
  line-height: 1;
}
.context-drawer-chevron > span {
  position: absolute;
  transition: opacity 0.3s ease;
}
.chev-collapse { opacity: 0; }
.chev-expand { opacity: 1; }
.context-drawer.is-open .chev-collapse { opacity: 1; }
.context-drawer.is-open .chev-expand { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .context-drawer { transition: none; }
  .context-drawer-chevron > span { transition: none; }
}
@media (max-width: 540px) {
  .context-drawer { bottom: calc(2.2rem + env(safe-area-inset-bottom, 0px)); }
  .context-drawer-body { max-width: 13rem; }
}

@media (max-width: 540px) {
  .cast-person-name { font-size: 1.25rem; }
  .cast-intro { min-height: calc(100vh - 10rem); }
}

/* ---- cast portraits (Gene/Joan and any pictured person) ---------- */

.cast-person--portrait {
  display: flex;
  gap: 1.4rem;
  align-items: flex-start;
}
.cast-person--portrait .cast-person-text { flex: 1; min-width: 0; }
.cast-portrait {
  flex-shrink: 0;
  width: 168px;
  margin: 0;
}
.cast-portrait img {
  width: 100%;
  height: auto;
  display: block;
  background: var(--paper);
  padding: 7px;
  border: 1px solid rgba(var(--brass-rgb), 0.3);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 10px 24px -12px rgba(var(--navy-rgb), 0.3),
    0 2px 6px rgba(var(--shadow-rgb), 0.08);
}
.cast-portrait figcaption {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 0.82rem;
  color: var(--walnut-mute);
  text-align: center;
  margin-top: 0.5rem;
  line-height: 1.4;
}
.cast-portrait--empty {
  width: 168px;
  aspect-ratio: 4 / 5;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed rgba(var(--brass-rgb), 0.5);
  background: rgba(var(--brass-faint-rgb), 0.18);
  border-radius: 2px;
}
.cast-portrait--empty span {
  font-family: var(--serif-body);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  text-align: center;
  line-height: 1.6;
  opacity: 0.8;
}
@media (max-width: 560px) {
  .cast-person--portrait { flex-direction: column; align-items: center; }
  .cast-person--portrait .cast-person-text { width: 100%; }
  .cast-portrait, .cast-portrait--empty { width: 62%; max-width: 220px; }
}

/* ---- photo gallery ----------------------------------------------- */

.gallery {
  max-width: 52rem;
  margin: 0 auto;
  padding: 1rem 0 2rem;
}
.gallery-head { text-align: center; margin-bottom: 2.2rem; }
.gallery-eyebrow {
  font-family: var(--serif-body);
  font-size: 0.72rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--brass);
  font-weight: 500;
  margin-bottom: 0.8rem;
}
.gallery-title {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: clamp(2.2rem, 5vw, 3rem);
  color: var(--ink);
  margin: 0;
  letter-spacing: -0.015em;
}
.gallery-blurb {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--walnut-soft);
  max-width: 34rem;
  margin: 0.6rem auto 0;
}
.gallery-head .brass-rule { margin: 1.2rem auto 0; max-width: 12rem; }
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 1.4rem;
}
@media (min-width: 600px) {
  .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.8rem; }
}
.gallery-item { margin: 0; }
.gallery-thumb {
  display: block;
  width: 100%;
  padding: 7px;
  cursor: pointer;
  background: var(--paper);
  border: 1px solid rgba(var(--brass-rgb), 0.28);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 10px 24px -12px rgba(var(--navy-rgb), 0.28),
    0 2px 6px rgba(var(--shadow-rgb), 0.07);
  transition: transform 0.3s cubic-bezier(0.65,0,0.35,1), box-shadow 0.3s ease;
}
.gallery-thumb:hover, .gallery-thumb:focus-visible {
  transform: translateY(-3px);
  outline: none;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 16px 30px -12px rgba(var(--navy-rgb), 0.32),
    0 4px 10px rgba(var(--shadow-rgb), 0.1);
}
.gallery-thumb img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: var(--card-deep);
  filter: sepia(0.06);
}
.gallery-item figcaption {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: 0.9rem;
  color: var(--walnut-mute);
  text-align: center;
  margin-top: 0.6rem;
  line-height: 1.4;
}

/* lightbox "turn over" control (reverse of a photo) */
.lb-flip {
  margin-top: 0.9rem;
  background: none;
  border: 1px solid rgba(var(--brass-soft-rgb), 0.45);
  border-radius: 2px;
  color: var(--brass-faint);
  font-family: var(--serif-body);
  font-style: italic;
  font-size: 0.82rem;
  padding: 0.4rem 1.1rem;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}
.lb-flip:hover, .lb-flip:focus-visible {
  color: var(--navy-deep);
  background: var(--brass-faint);
  border-color: var(--brass-faint);
  outline: none;
}

/* ---- name highlight (jump from cast) ----------------------------- */

.name-mark {
  background: transparent;
  color: inherit;
  border-radius: 2px;
  padding: 0 0.06em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  animation: name-mark-flash 2.6s ease-out 0.25s both;
}
@keyframes name-mark-flash {
  0%   { box-shadow: 0 0 0 2px rgba(var(--signal-rgb), 0);    background: rgba(var(--signal-rgb), 0); }
  12%  { box-shadow: 0 0 0 2px rgba(var(--signal-rgb), 0.95); background: rgba(var(--signal-rgb), 0.12); }
  72%  { box-shadow: 0 0 0 2px rgba(var(--signal-rgb), 0.95); background: rgba(var(--signal-rgb), 0.12); }
  100% { box-shadow: 0 0 0 2px rgba(var(--signal-rgb), 0);    background: rgba(var(--signal-rgb), 0); }
}
@media (prefers-reduced-motion: reduce) {
  .name-mark { animation: none; box-shadow: 0 0 0 2px rgba(var(--signal-rgb), 0.9); }
}

/* ---- return-to-cast button --------------------------------------- */

.return-to-cast {
  position: fixed;
  left: 50%;
  bottom: 4.8rem;
  transform: translateX(-50%);
  z-index: 30;
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  font-family: var(--serif-body);
  font-size: 0.64rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  background: rgba(var(--signal-rgb), 0.94);
  border: 1px solid rgba(var(--signal-rgb), 0.95);
  border-radius: 2px;
  padding: 0.55rem 1.15rem;
  cursor: pointer;
  box-shadow: 0 8px 20px -8px rgba(var(--war-red-rgb), 0.6);
  transition: background 0.25s ease, transform 0.25s ease;
  animation: rtc-in 0.4s cubic-bezier(0.22,1,0.36,1) both;
}
.return-to-cast:hover, .return-to-cast:focus-visible {
  background: rgba(var(--signal-deep-rgb), 0.97);
  outline: none;
  transform: translateX(-50%) translateY(-2px);
}
.rtc-arrow { font-family: var(--serif-display); font-size: 1.05rem; line-height: 1; }
@keyframes rtc-in {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .return-to-cast { animation: none; } }
@media (max-width: 540px) {
  .return-to-cast { bottom: 4.2rem; font-size: 0.6rem; padding: 0.5rem 0.9rem; }
}

/* ---- nav chrome -------------------------------------------------- */

.nav-chrome {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.4rem 2rem;
  z-index: 20;
  pointer-events: none;
  background: linear-gradient(to top, var(--paper) 35%, rgba(var(--paper-rgb), 0));
  transition: background 0.4s ease;
}
body.body--navy .nav-chrome {
  background: linear-gradient(to top, var(--chapter-navy) 35%, rgba(var(--chapter-navy-rgb), 0));
}
.nav-btn {
  pointer-events: auto;
  background: none;
  border: none;
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.7rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  cursor: pointer;
  padding: 0.7rem 0.4rem;
  transition: color 0.25s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.7em;
  position: relative;
  font-weight: 500;
}
.nav-btn::after {
  content: "";
  position: absolute;
  left: 0.4rem;
  right: 0.4rem;
  bottom: 0.45rem;
  height: 1px;
  background: var(--brass);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.32s cubic-bezier(0.65, 0, 0.35, 1);
}
.nav-btn.nav-prev::after { transform-origin: right center; }
.nav-btn:hover, .nav-btn:focus-visible {
  color: var(--ink);
  outline: none;
}
.nav-btn:hover::after, .nav-btn:focus-visible::after { transform: scaleX(1); }
.nav-btn:hover .nav-arrow { transform: translateX(4px); }
.nav-btn.nav-prev:hover .nav-arrow { transform: translateX(-4px); }
.nav-btn:disabled {
  visibility: hidden;
  cursor: default;
}
.nav-arrow {
  font-style: normal;
  font-family: var(--serif-display);
  font-size: 1.4rem;
  color: var(--brass);
  transition: transform 0.32s cubic-bezier(0.65, 0, 0.35, 1), color 0.25s ease;
  line-height: 1;
}
.nav-btn:hover .nav-arrow { color: var(--ink); }
body.body--navy .nav-btn { color: var(--brass-faint); }
body.body--navy .nav-btn:hover, body.body--navy .nav-btn:focus-visible { color: var(--ink); }
body.body--navy .nav-btn::after { background: var(--brass-soft); }
body.body--navy .nav-arrow { color: var(--brass-soft); }
body.body--navy .nav-btn:hover .nav-arrow { color: var(--ink); }

/* contents button — center bottom */
.toc-btn {
  pointer-events: auto;
  position: absolute;
  left: 50%;
  bottom: 1.5rem;
  transform: translateX(-50%);
  background: none;
  border: 1px solid rgba(var(--brass-rgb), 0.45);
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.7rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  cursor: pointer;
  padding: 0.55rem 1.3rem;
  border-radius: 2px;
  transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, letter-spacing 0.3s ease;
  font-weight: 500;
}
.toc-btn:hover, .toc-btn:focus-visible {
  color: var(--ink);
  border-color: var(--brass);
  background: rgba(var(--brass-faint-rgb), 0.5);
  letter-spacing: 0.3em;
  outline: none;
}
body.body--navy .toc-btn {
  color: var(--brass-faint);
  border-color: rgba(var(--brass-soft-rgb), 0.4);
}
body.body--navy .toc-btn:hover {
  color: var(--ink);
  background: rgba(var(--navy-rgb), 0.25);
  border-color: var(--brass-soft);
}

@media (max-width: 540px) {
  .nav-chrome { padding: 1rem 1.1rem; }
  .nav-btn { font-size: 0.86rem; padding: 0.4rem 0.55rem; }
  .toc-btn { font-size: 0.7rem; padding: 0.4rem 0.85rem; bottom: 1.05rem; }
}

/* ---- table of contents (side drawer) ---------------------------- */

.toc-overlay {
  position: fixed;
  inset: 0;
  background: rgba(var(--shadow-rgb), 0.6);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 90;
  animation: toc-fadein 0.32s cubic-bezier(0.65, 0, 0.35, 1);
}
@keyframes toc-fadein { from { opacity: 0; } to { opacity: 1; } }

.toc-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(480px, 100vw);
  background: var(--paper);
  overflow-y: auto;
  padding: 2.6rem clamp(1.4rem, 3.5vw, 2.4rem) 5rem;
  box-shadow:
    -2px 0 0 rgba(var(--brass-rgb), 0.18),
    -24px 0 64px rgba(0,0,0,0.28);
  animation: toc-slidein 0.42s cubic-bezier(0.65, 0, 0.35, 1);
  background-image:
    radial-gradient(ellipse at 80% 0%, rgba(var(--brass-rgb), 0.06), transparent 55%),
    radial-gradient(ellipse at 20% 100%, rgba(var(--shadow-rgb), 0.05), transparent 55%);
}
@keyframes toc-slidein {
  from { transform: translateX(100%); }
  to   { transform: translateX(0); }
}
@media (prefers-reduced-motion: reduce) {
  .toc-panel { animation: none; }
}

.toc-header {
  position: sticky;
  top: -2.6rem;
  margin: -2.6rem -2.4rem 1.6rem;
  padding: 2rem 2.4rem 1.2rem;
  background: var(--paper);
  border-bottom: 1px solid rgba(var(--brass-rgb), 0.22);
  z-index: 1;
}
.toc-header-eyebrow {
  font-family: var(--serif-body);
  font-size: 0.66rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--brass);
  font-weight: 500;
  margin-bottom: 0.6rem;
}
.toc-title {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 2rem;
  color: var(--ink);
  margin: 0 0 0.4rem;
  letter-spacing: -0.01em;
}
.toc-sub {
  font-family: var(--serif-body);
  font-style: italic;
  font-size: 0.95rem;
  color: var(--walnut-mute);
}
.toc-section {
  margin-bottom: 1.8rem;
}
.toc-section-head {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 0.7rem;
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 1.32rem;
  color: var(--navy-deep);
  margin-bottom: 0.7rem;
  background: none;
  border: none;
  border-bottom: 1px solid rgba(var(--navy-rgb), 0.22);
  padding: 0.6rem 0.3rem 0.55rem;
  width: 100%;
  cursor: pointer;
  text-align: left;
  font: inherit;
  transition: color 0.22s ease, border-color 0.22s ease;
}
.toc-section-head .toc-section-numeral,
.toc-section-head .toc-section-loc {
  font: inherit;
  font-family: var(--serif-body);
  font-style: normal;
}
.toc-section-head .toc-section-numeral {
  font-size: 0.66rem;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--navy);
  font-weight: 500;
  min-width: 4em;
  flex-shrink: 0;
}
.toc-section-head .toc-section-title {
  flex: 1;
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 1.32rem;
  color: var(--navy-deep);
}
.toc-section-head .toc-section-loc {
  font-size: 0.66rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brass);
  font-weight: 500;
}
.toc-section-head:hover {
  color: var(--ink);
  border-bottom-color: var(--brass);
}
/* Progress fill sitting on top of the section-head's border-bottom.
   Width is set inline from the React component based on how far the
   reader has progressed through this chapter (0 = not yet entered,
   1 = past the last letter). Painted instantly, not animated, so the
   drawer's slide-in remains the only motion. */
.toc-section-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: rgba(var(--brass-rgb), 0.10);
  pointer-events: none;
  overflow: hidden;
}
.toc-section-progress-fill {
  display: block;
  height: 100%;
  background: var(--brass);
  opacity: 0.85;
}
.toc-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.toc-item {
  display: flex;
  align-items: flex-start;
  gap: 0.85rem;
  padding: 0.7rem 0.7rem 0.7rem 0.55rem;
  font-family: var(--serif-body);
  font-size: 0.94rem;
  color: var(--walnut-soft);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  border-left: 2px solid transparent;
  transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease, padding-left 0.28s cubic-bezier(0.65, 0, 0.35, 1);
}
.toc-item:hover, .toc-item:focus-visible {
  background: rgba(var(--brass-faint-rgb), 0.42);
  color: var(--ink);
  padding-left: 0.85rem;
  outline: none;
}
.toc-item.is-current {
  color: var(--ink);
  background: rgba(var(--brass-faint-rgb), 0.45);
  border-left-color: var(--brass);
  padding-left: 0.85rem;
}
/* Small anchor glyph marks the currently-active letter on the right
   side of the row. Color picks up var(--brass) via currentColor so the
   mark sits in the same palette as the left-border accent. */
.toc-anchor {
  flex-shrink: 0;
  color: var(--brass);
  opacity: 0.85;
  align-self: center;
  margin-left: 0.5rem;
}
.toc-item .toc-status,
.toc-item .toc-num {
  flex-shrink: 0;
  margin-top: 0.42em;
}
.toc-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.18rem;
  align-items: flex-start;
}
.toc-meta .toc-date {
  font-style: italic;
  font-size: 0.96rem;
  color: inherit;
  white-space: nowrap;
}
.toc-meta .toc-loc {
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
  line-height: 1.4;
}
.toc-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid var(--brass);
}
.toc-status--transcribed { background: var(--brass); }
.toc-status--draft { background: transparent; }
.toc-status--envelope { background: var(--walnut-mute); border-color: var(--walnut-mute); }
.toc-status--special { background: var(--navy); border-color: var(--navy); }
.toc-num {
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--brass);
  letter-spacing: 0.04em;
  min-width: 2em;
  font-weight: 500;
}
.toc-date {
  flex: 1;
  font-style: italic;
  font-size: 0.95rem;
}
.toc-loc {
  font-size: 0.66rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
}
.toc-close {
  position: absolute;
  top: 1rem;
  right: 1.1rem;
  background: none;
  border: 1px solid rgba(var(--brass-rgb), 0.35);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  color: var(--walnut-mute);
  font-family: var(--serif-display);
  font-style: normal;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.22s ease, border-color 0.22s ease, background 0.22s ease, transform 0.3s cubic-bezier(0.65, 0, 0.35, 1);
  z-index: 2;
}
.toc-close:hover {
  color: var(--ink);
  border-color: var(--brass);
  background: rgba(var(--brass-faint-rgb), 0.4);
  transform: rotate(90deg);
}

.toc-entry {
  width: 100%;
  background: none;
  border: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
  padding: 0.65rem 0.7rem 0.65rem 0.55rem;
  color: var(--walnut-soft);
  font-family: var(--serif-body);
  font-size: 0.95rem;
  display: flex; align-items: center; gap: 0.85rem;
  border-left: 2px solid transparent;
  transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease, padding-left 0.28s cubic-bezier(0.65, 0, 0.35, 1);
  margin-bottom: 0.3rem;
}
.toc-entry:hover, .toc-entry:focus-visible {
  background: rgba(var(--brass-faint-rgb), 0.42);
  color: var(--ink);
  padding-left: 0.85rem;
  outline: none;
}
.toc-entry.is-current {
  color: var(--ink);
  background: rgba(var(--brass-faint-rgb), 0.45);
  border-left-color: var(--brass);
  padding-left: 0.85rem;
}
.toc-entry .toc-date {
  font-style: italic;
}

/* ---- lightbox ---------------------------------------------------- */

.lightbox {
  position: fixed;
  inset: 0;
  background: var(--chapter-navy-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 2rem;
  animation: fadein 0.32s cubic-bezier(0.65, 0, 0.35, 1);
}
.lightbox::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 25%, rgba(var(--brass-soft-rgb), 0.05), transparent 55%),
    radial-gradient(ellipse at 70% 80%, rgba(var(--navy-rgb), 0.4), transparent 60%),
    radial-gradient(ellipse 100% 80% at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%);
  pointer-events: none;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.lb-stage {
  max-width: min(900px, 92vw);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  position: relative;
  z-index: 1;
  animation: lb-zoomin 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes lb-zoomin {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .lb-stage { animation: none; }
}
.lb-frame {
  background: var(--brass-faint);
  padding: 18px;
  border: 1px solid var(--brass-soft);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.3),
    0 24px 60px -16px rgba(0,0,0,0.6),
    0 8px 24px rgba(0,0,0,0.35);
}
.lb-stage img {
  max-width: 100%;

  object-fit: contain;

}

}
.lb-meta-date {

}
.lb-counter {
  font-family: var(--mono);
  font-style: normal;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-size: 0.7rem;
  color: var(--brass-soft);
  font-weight: 500;
}
/* "full resolution" — opens the untouched original scan in a new tab */
.lb-full {
  font-family: var(--mono);
  font-style: normal;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-size: 0.7rem;
  color: var(--brass-soft);
  font-weight: 500;
  text-decoration: none;
  border-bottom: 1px solid rgba(var(--brass-soft-rgb), 0.35);
  padding-bottom: 1px;
  transition: color 0.25s ease, border-color 0.25s ease;
}

  border-color: rgba(var(--brass-soft-rgb), 0.7);

}
.lb-close {
  position: absolute;
  top: 1.4rem; right: 1.6rem;
  background: none;
  border: 1px solid rgba(var(--brass-soft-rgb), 0.45);
  border-radius: 50%;
  width: 42px; height: 42px;
  color: var(--brass-faint);
  font-family: var(--serif-display);
  font-style: normal;
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, transform 0.32s cubic-bezier(0.65, 0, 0.35, 1);
  z-index: 2;
}
.lb-close:hover, .lb-close:focus-visible {
  color: var(--navy-deep);

  border-color: var(--brass-faint);

}

  color: var(--brass-faint);

  cursor: pointer;
  padding: 0;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  z-index: 2;
}
.lb-prev { left: 1.4rem; }
.lb-next { right: 1.4rem; }
.lb-nav:hover, .lb-nav:focus-visible {
  color: var(--navy-deep);

/* ---- cover dedication letter (popup overlay) -------------------- */
/* A personal letter from the grandson, presented as a popup over the
   title page. Different aesthetic from Eugene's letters: plainer
   typography, no postmark / drop cap / handwritten salutation,
   left-aligned everything, two short paragraphs, two colored news
   buttons, clean signoff. Goal is a clear intro the average reader
   finishes without feeling overwhelmed.

   Mount is delayed ~2s in App so the title-page entrance animations
   play before the overlay appears. */
.cover-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(var(--shadow-rgb), 0.6);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  overflow-y: auto;
  animation: cover-fadein 0.7s ease;
}
@keyframes cover-fadein {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.cover-popup {
  background: var(--paper-light);             /* slightly lighter than --paper to
                                      separate visually from Eugene's
                                      cream letter cards */
  max-width: 33rem;
  width: 100%;
  border: 1px solid rgba(var(--navy-rgb), 0.22);
  border-radius: 6px;
  padding: 2.6rem 2.2rem 1.9rem;
  text-align: left;                /* letter format */
  position: relative;
  box-shadow:
    0 32px 70px -18px rgba(0,0,0,0.55),
    0 12px 30px rgba(0,0,0,0.3);
  /* Float in: rises ~70px on a long, gentle ease-out so it settles
     into place rather than snapping. */
  animation: cover-floatin 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes cover-floatin {
  from { opacity: 0; transform: translateY(72px); }
  to   { opacity: 1; transform: translateY(0); }
}

.cover-x {
  position: absolute;
  top: 0.55rem;
  right: 0.7rem;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--walnut-mute);
  font-family: var(--serif-display);
  font-size: 1.55rem;
  line-height: 1;
  padding: 0.3rem 0.6rem;
  transition: color 0.2s ease, transform 0.25s ease;
}
.cover-x:hover, .cover-x:focus-visible {
  color: var(--ink);
  transform: rotate(90deg);
  outline: none;
}

.cover-salutation {
  font-family: var(--serif-display);
  font-style: italic;
  font-weight: 500;
  font-size: 1.6rem;
  color: var(--navy-deep);
  margin: 0 0 1.1rem;
  letter-spacing: 0.005em;
}

.cover-body {
  font-family: var(--serif-body);
  font-style: normal;
  font-weight: 400;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--walnut);
  margin: 0 0 1.1rem;
  text-align: justify;
  text-align-last: left;
  hyphens: auto;
  -webkit-hyphens: auto;
  -ms-hyphens: auto;
  hyphenate-limit-chars: 6 3 3;
}
.cover-body:last-of-type { margin-bottom: 1.5rem; }

.cover-context-label {
  font-family: var(--serif-body);
  font-size: 0.66rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--walnut-mute);
  font-weight: 500;
  margin: 0 0 0.7rem;
}

.cover-buttons {
  display: flex;
  gap: 0.7rem;
  margin: 0 0 1.7rem;
  flex-wrap: wrap;
}
.cover-button {
  flex: 1;
  min-width: 9rem;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15rem;
  text-decoration: none;
  text-align: center;
  padding: 0.7rem 0.9rem;
  font-family: var(--serif-body);
  border-radius: 3px;
  font-weight: 500;
  border: 1px solid transparent;
  transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 4px rgba(var(--shadow-rgb), 0.12);
}
.cover-button:hover, .cover-button:focus-visible {
  transform: translateY(-1px);
  box-shadow: 0 6px 12px rgba(var(--shadow-rgb), 0.2);
  outline: none;
}
.cover-button-label {
  font-size: 0.58rem;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  opacity: 0.7;
  font-weight: 600;
}
.cover-button-text {
  font-size: 0.95rem;
  font-style: italic;
  font-family: var(--serif-display);
  letter-spacing: 0.01em;
}
.cover-button--navy {
  background: var(--navy-deep);
  color: var(--paper);
  border-color: var(--navy-deep);
}
.cover-button--navy:hover {
  background: var(--navy);
}
.cover-button--brass {
  background: var(--brass);
  color: var(--paper);
  border-color: var(--brass);
}
.cover-button--brass:hover {
  background: var(--brass-deep);             /* slightly deeper brass on hover */
}

.cover-signoff {
  margin: 0.4rem 0 0;
  text-align: left;
}
/* Signoff: the grandson signing off the way Gene signed his letters —
   'Love, Always,' in the hand, the printed name in plain serif below,
   with the gap a real letter leaves between closing and signature. */
.cover-signoff-handwritten {
  font-family: var(--hand);
  font-size: 1.45rem;
  line-height: 1.3;
  color: var(--walnut);
  margin: 0;
}
.cover-signoff-name {
  font-family: var(--serif-body);
  font-style: normal;
  font-weight: 400;
  font-size: 1rem;
  line-height: 1.55;
  color: var(--walnut);
  margin: 0.45rem 0 0;
}

/* The context section sits apart from the note above it, behind its
   own hairline — background reading, not part of the letter. */
.cover-context {
  margin-top: 1.5rem;
  padding-top: 1.2rem;
  border-top: 1px solid rgba(var(--brass-rgb), 0.3);
  margin-bottom: 0.2rem;
}

.cover-close {
  display: block;
  width: 100%;
  background: transparent;
  border: 1px solid rgba(var(--navy-rgb), 0.4);
  font-family: var(--serif-body);
  font-style: normal;
  font-size: 0.68rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--navy);
  cursor: pointer;
  padding: 0.75rem 1rem;
  border-radius: 2px;
  font-weight: 500;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, letter-spacing 0.25s ease;
}
.cover-close:hover, .cover-close:focus-visible {
  background: var(--navy-deep);
  border-color: var(--navy-deep);
  color: var(--paper);
  letter-spacing: 0.32em;
  outline: none;
}

@media (prefers-reduced-motion: reduce) {
  .cover-backdrop, .cover-popup { animation: none; }
}

@media (max-width: 540px) {
  .cover-popup { padding: 2rem 1.5rem 1.5rem; }
  .cover-salutation { font-size: 1.4rem; }
  .cover-body { font-size: 1rem; line-height: 1.65; }
  .cover-buttons { flex-direction: column; }
  .cover-button { width: 100%; min-width: 0; }
}

/* ---- responsive -------------------------------------------------- */

@media (max-width: 540px) {
  body { font-size: 17px; }
  .archive { padding: 2.4rem 1.1rem 9rem; }
  .title-page { padding: 2.5rem 0; }
  .letter-body { padding: 1.9rem 1.3rem 1.7rem; font-size: 1rem; }
  .signature { font-size: 2.1rem; }
  .folio { font-size: 0.6rem; margin-bottom: 1.4rem; gap: 0.6rem; }
  .folio::before, .folio::after { width: 18px; }
  .folio--running { gap: 0.8rem; letter-spacing: 0.18em; }
  .folio-chapter-title { font-size: 0.86rem; max-width: 12em; }
  .folio-chapter-num { font-size: 0.56rem; letter-spacing: 0.24em; }
  .letter-head { margin-bottom: 1.4rem; }
  .letter-body .dropcap { font-size: 3.1em; width: 0.92em; }
  .chapter-bridge { font-size: 1.05rem; padding: 0 0.8rem; }
  .chapter-bridge::before, .chapter-bridge::after { font-size: 3rem; }
}
@media (max-width: 360px) {
  .folio-left .folio-sep, .folio-chapter-num { display: none; }
  .folio-chapter-title { max-width: 8em; }
}

/* ---- progress bar (top of viewport) ----------------------------- */

.progress {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  pointer-events: none;
  z-index: 25;
  opacity: 0;
  transition: opacity 0.5s ease 0.2s;
}
.progress.is-visible { opacity: 1; }
.progress-track {
  position: absolute;
  inset: 0;
  background: rgba(var(--brass-rgb), 0.18);
}
body.body--navy .progress-track { background: rgba(var(--brass-soft-rgb), 0.18); }
.progress-fill {
  position: absolute;
  top: 0; bottom: 0;
  left: 0;
  background: var(--brass);
  transition: width 0.42s cubic-bezier(0.65, 0, 0.35, 1);
  box-shadow: 0 0 6px rgba(var(--brass-rgb), 0.4);
}
body.body--navy .progress-fill { background: var(--brass-soft); box-shadow: 0 0 6px rgba(var(--brass-soft-rgb), 0.5); }
.progress-marker {
  position: absolute;
  top: 50%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(var(--brass-rgb), 0.5);
  transition: background 0.3s ease, transform 0.3s ease;
}
.progress-marker.is-active {
  background: var(--brass);
  transform: translate(-50%, -50%) scale(1.4);
}
body.body--navy .progress-marker { background: rgba(var(--brass-soft-rgb), 0.45); }
body.body--navy .progress-marker.is-active { background: var(--brass-faint); }

/* ---- entrance animations --------------------------------------- */

@keyframes fade-rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.title-page .ornament,
.title-page .title,
.title-page .subtitle,
.title-page .title-locator {
  animation: fade-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.title-page .ornament { animation-delay: 0.05s; }
.title-page .title { animation-delay: 0.18s; animation-duration: 1.2s; }
.title-page .subtitle { animation-delay: 0.42s; }
.title-page .title-locator { animation-delay: 0.62s; }

.chapter-divider > *:not(.chapter-watermark) {
  animation: fade-rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.chapter-divider > .chapter-numeral { animation-delay: 0.05s; }
.chapter-divider > .chapter-title { animation-delay: 0.18s; animation-duration: 1.1s; }
.chapter-divider > .chapter-loc { animation-delay: 0.36s; }
.chapter-divider > .chapter-dates { animation-delay: 0.46s; }
.chapter-divider > .route-wrap { animation-delay: 0.6s; }
.chapter-divider > .chapter-bridge { animation-delay: 0.78s; }
.chapter-watermark { animation: fade-in 1.6s ease 0.2s both; }

.journey-page > * {
  animation: fade-rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.journey-page > .journey-title { animation-delay: 0.05s; animation-duration: 1.1s; }
.journey-page > .journey-dates { animation-delay: 0.22s; }
.journey-page > .hairline-rule { animation-delay: 0.32s; }
.journey-page > .journey-chart { animation-delay: 0.38s; }
.journey-page > .journey-legend { animation-delay: 0.8s; }
.journey-page > .journey-note-plain { animation-delay: 1s; }
.journey-page > .journey-note { animation-delay: 1.12s; }
.journey-page > .journey-signoff { animation-delay: 1.24s; }

@media (prefers-reduced-motion: reduce) {
  .title-page .ornament,
  .title-page .title,
  .title-page .subtitle,
  .title-page .title-locator,
  .chapter-divider > *:not(.chapter-watermark),
  .chapter-watermark,
  .journey-page > * {
    animation: none !important;
  }
}

/* ---- print -------------------------------------------------------- */

@media print {
  html, body { overflow: visible; height: auto; }
  .paper-grain, .atmosphere, .nav-chrome, .toc-btn, .photo-link, .lb-close, .lb-nav, .progress, .postmark { display: none; }
  .stage { height: auto; overflow: visible; }
  .page-surface { position: static; box-shadow: none; }
  .archive { max-width: none; padding: 0; }
  .letter-card { page-break-inside: avoid; }
  .chapter-divider { page-break-before: always; }
  .letter-body { box-shadow: none; border: 1px solid rgba(0,0,0,0.2); }
}

/* Invisible tap-target extensions. The visible controls stay exactly the
   same size; only the touch/click zone grows to ≥44px (small phone
   controls here are 30-40px). The ::before overlay is transparent and
   inherits the parent's cursor/click handling. */
.nav-btn, .photo-link { position: relative; }
.nav-btn::before, .toc-btn::before, .toc-close::before,
.photo-link::before, .lb-close::before, .lb-nav::before {
  content: "";
  position: absolute;
  inset: -8px;
}
.photo-link::before { inset: -12px -10px; }
